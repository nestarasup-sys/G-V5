name: Video Studio Export - synthetic foundation

on:
  push:
    branches: [master-desenvolvimento]
    paths:
      - '.github/workflows/video-export-synthetic.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/shared/videoFrame.ts'
      - 'src/shared/videoExportSnapshot.ts'
      - 'src/shared/videoCharacterTimeline.ts'
      - 'src/shared/videoCharacterTransitions.ts'
      - 'src/shared/videoCharacterInterpolation.ts'
      - 'src/shared/videoCharacterRenderAssets.ts'
      - 'src/shared/videoSceneIR.ts'
      - 'src/shared/videoStudioAudioPlan.ts'
      - 'src/shared/videoExportCharacters.ts'
      - 'src/shared/videoExportRuntime.ts'
      - 'src/shared/videoExportSurface.ts'
      - 'src/shared/videoStageGeometry.ts'
      - 'src/renderer/src/features/videoStudio/characterTrack.ts'
      - 'src/renderer/src/features/videoStudio/characterTransitions.ts'
      - 'src/renderer/src/features/videoStudio/transitionRenderer.ts'
      - 'src/renderer/src/features/videoStudio/videoCharacterAssetCapture.ts'
      - 'src/renderer/src/features/videoStudio/useCharacterTransitions.ts'
      - 'src/renderer/src/features/videoStudio/videoCanvasCompositor.ts'
      - 'src/renderer/src/features/videoStudio/videoCharacterFrameRenderer.ts'
      - 'src/renderer/src/features/videoStudio/videoExportMediaFramePool.ts'
      - 'src/renderer/src/features/videoStudio/VideoExportSurfacePage.tsx'
      - 'src/renderer/src/features/videoStudio/VideoStudioEditor.tsx'
      - 'src/renderer/src/ui/App.tsx'
      - 'src/renderer/src/desktop.d.ts'
      - 'src/renderer/src/features/customizer/CustomizerPage.tsx'
      - 'electron/videoExportJobs.ts'
      - 'electron/videoExportSnapshotAssets.ts'
      - 'electron/videoExportAssets.ts'
      - 'electron/videoLibrary.ts'
      - 'electron/videoExports.ts'
      - 'electron/videoRawFrameWriter.ts'
      - 'electron/videoSyntheticRaster.ts'
      - 'electron/videoFfmpegCapabilities.ts'
      - 'electron/videoSerialChunkEncoder.ts'
      - 'electron/videoOutputVerifier.ts'
      - 'electron/videoExportAssembler.ts'
      - 'electron/videoMediaProbe.ts'
      - 'electron/videoToolsResolver.ts'
      - 'electron/videoExportSurfaceHost.ts'
      - 'electron/videoExportCoordinator.ts'
      - 'electron/preload.ts'
      - 'electron/videoExportPreload.ts'
      - 'electron.vite.config.ts'
      - 'electron/main.ts'
      - 'tests/video-export-*.test.cjs'
      - 'tests/video-scene-ir.test.cjs'
      - 'tests/video-timeline-index.test.cjs'
      - 'tests/video-frame-determinism.test.cjs'
      - 'tests/video-character-*.test.cjs'
      - 'tests/video-studio-audio-plan.test.cjs'
      - 'tests/video-raw-frame-writer.test.cjs'
      - 'tests/video-synthetic-raster.test.cjs'
      - 'tests/video-ffmpeg-capabilities.test.cjs'
      - 'tests/video-output-verifier.test.cjs'
      - 'tests/video-media-probe.test.cjs'
      - 'tests/video-stage-geometry.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-windows:
    name: Synthetic contracts / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts or Electron native rebuilds
        id: install
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify synthetic export tests only
        shell: pwsh
        run: npm run test:export:synthetic
      - name: Validate TypeScript contracts
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run typecheck
      - name: Validate production bundling (not an Electron runtime smoke)
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run build
