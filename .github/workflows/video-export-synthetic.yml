permissions:
  contents: read

concurrency:
  group: export-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-windows:
    name: Synthetic contracts / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts or Electron native rebuilds
        id: install
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify synthetic export tests only
        shell: pwsh
        run: npm run test:export:synthetic
      - name: Validate TypeScript contracts
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run typecheck
      - name: Validate production bundling (not an Electron runtime smoke)
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run build
      - name: Install Electron runtime for isolated surface smoke
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: node node_modules/electron/install.js
      - name: Smoke isolated offscreen export surface
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:export:electron-surface
      - name: Resolve FFmpeg tools for real end-to-end smoke
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if (-not $ffmpeg -or -not $ffprobe) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
            $ffprobe = Get-Command ffprobe -ErrorAction Stop
          }
          "GACHA_FFMPEG_PATH=$($ffmpeg.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GACHA_FFPROBE_PATH=$($ffprobe.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $ffmpeg.Source -hide_banner -encoders | Select-String 'h264_mf'
      - name: Run real Electron to H264 end-to-end smoke
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:export:e2e-electron
      - name: Generate and probe 5s/30s + 24/29.97/60/VFR fixtures
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:export:av-fixtures
      - name: Validate real AAC trim delay and final MP4 audio
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:export:audio-assembly
      - name: Compare production preview DOM against export Canvas
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:export:preview-oracle
      - name: Compare character animation and imported video against export Canvas
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:video:character-media-oracle
      - name: Run two-worker Turbo surface/encoder concat smoke
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: npm run test:export:turbo-e2e
