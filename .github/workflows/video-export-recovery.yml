name: Video Studio interrupted MP4 recovery

on:
  push:
    branches: [master-desenvolvimento]
    paths:
      - 'package.json'
      - 'scripts/video-studio/hybrid-fragmented-recovery-smoke.cjs'
      - '.github/workflows/video-export-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-export-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-recovery-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the exact pinned LGPL runtime used by production
        shell: pwsh
        run: |
          ./scripts/video-studio/prepare-ffmpeg-lgpl.ps1
          $ffmpeg = (Resolve-Path ./resources/video-tools/ffmpeg.exe).Path
          $ffprobe = (Resolve-Path ./resources/video-tools/ffprobe.exe).Path
          "GACHA_FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GACHA_FFPROBE_PATH=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Kill fragmented MP4 and recover by remux
        run: npm run test:export:hybrid-recovery
      - name: Remove downloaded runtime
        if: always()
        shell: pwsh
        run: Remove-Item ./resources/video-tools -Recurse -Force -ErrorAction SilentlyContinue
