name: Wardrobe pose regression

on:
  push:
    branches: [fix/wardrobe-affine-pose-test]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify AppData fixture and pose transformations
        run: npm run test:wardrobe
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Electron renderer and main build
        run: npm run build
